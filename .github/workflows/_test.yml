on:
  workflow_call:
    inputs:
      python-version:
        type: string
        description: The version of python to install, default is from .python-version file
        default: ""
      runs-on:
        type: string
        description: The runner to run this job on
        required: true
      pytest-args:
        type: string
        description: Extra arguments to pass to pytest, e.g. to select tests by marker
        default: ""
      name:
        type: string
        description: Label for this test run, used to name the coverage upload
        default: ""

env:
  # https://github.com/pytest-dev/pytest/issues/2042
  PY_IGNORE_IMPORTMISMATCH: "1"
  UV_PYTHON: ${{ inputs.python-version }}

jobs:
  run:
    runs-on: ${{ inputs.runs-on }}
    # system tests download and launch a Minecraft server so allow plenty of time
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Need this to get version number from last tag
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: Run tests
        run: uv run --locked tox -e tests -- ${{ inputs.pytest-args }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          name: ${{ inputs.name || inputs.python-version }}/${{ inputs.runs-on }}
          files: cov.xml
